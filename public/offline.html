<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f0fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1045" media="(prefers-color-scheme: dark)" />
    <title>Sin conexión | Control Financiero</title>
    <style>
      :root { color-scheme: light dark; --bg: #f1f0fd; --card: #fff; --fg: #15163f; --muted: #55587f; --pri: #4a45d6; --line: #d8d7ee; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1045; --card: #181a5c; --fg: #f5f5ff; --muted: #a9acd2; --pri: #a9a5ff; --line: #333787; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { width: 100%; max-width: 26rem; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 1.5rem; padding: 2rem 1.5rem; }
      svg { width: 3.5rem; height: 3.5rem; }
      h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 1.25rem; }
      button { font: inherit; font-weight: 600; min-height: 2.75rem; padding: 0 1.5rem; border: 0; border-radius: .6rem; background: var(--pri); color: #fff; cursor: pointer; }
      @media (prefers-color-scheme: dark) { button { color: #0f1045; } }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4a45d6" />
        <path d="M21.35 10.05A8 8 0 1 0 21.35 21.95" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        <path d="M13.5 18.6 17 15.1 19.6 17.4 25.6 10.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="25.6" cy="10.6" r="1.9" fill="#fff" />
      </svg>
      <h1>Sin conexión</h1>
      <p>Control Financiero necesita Internet para mostrar y guardar tus datos. Tu información no se pierde: vuelve a intentarlo cuando recuperes la conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>

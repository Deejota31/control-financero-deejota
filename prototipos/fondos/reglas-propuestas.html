<title>Reglas de fondos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

:root { --bg:#f6f6fa; --surface:#fff; --surface-2:#ececf4; --line:#d9d9e6; --fg:#17172b; --muted:#58587a; --pri:#3a3fa6; --pri-fg:#fff; --pri-soft:#e0e1f7;

  --ok:#5ad08a; --ok-soft:#14301f; --bad:#ff8f86; --bad-soft:#3f1b18; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#0f0f1c; --surface:#181829; --surface-2:#222238; --line:#34344f; --fg:#ececf8; --muted:#a5a5c8; --pri:#9ea3ff; --pri-fg:#101030; --pri-soft:#26264a;

.tok:hover { transform: translateY(-1px); border-color: var(--pri); }

.card.inc { border-color: color-mix(in srgb, var(--ok) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 14%, transparent); } .card.exc { border-color: color-mix(in srgb, var(--bad) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 14%, transparent); }
.card header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; } .card header b { flex: 1; font-size: 15px; }
.sw { display: inline-flex; padding: 2px; background: var(--surface-2); border-radius: 99px; } .sw button { border: 0; background: none; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--muted); } .sw button[aria-pressed='true'].i { background: var(--ok); color: var(--surface); } .sw button[aria-pressed='true'].e { background: var(--bad); color: var(--surface); } .sw button[aria-pressed='true'].n { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.frase { font-size: 17px; line-height: 2.1; }

.picker { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); animation: ent .2s ease-out; } .picker .lst { max-height: 120px; overflow-y: auto; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; }

.carril h3 { margin: 0; padding: 9px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; } .carril .sc { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; } .carril.i { background: color-mix(in srgb, var(--ok-soft) 55%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 40%, transparent); } .carril.e { background: color-mix(in srgb, var(--bad-soft) 55%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.ficha { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); cursor: grab; } .ficha .n { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ficha .n small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.fl { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; } .fl:hover { background: var(--pri-soft); color: var(--pri); }
.pasos { display: flex; gap: 6px; margin-bottom: 10px; } .paso { flex: 1; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 12.5px; text-align: left; } .paso .num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; flex: none; } .paso[aria-current='step'] { border-color: var(--pri); background: var(--pri-soft); } .paso[aria-current='step'] .num { background: var(--pri); color: var(--pri-fg); } .paso.hecho .num { background: var(--ok); color: var(--surface); }
.grande { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; min-width: 0; } .grande:hover { border-color: var(--pri); } .grande.inc { border-color: var(--ok); background: var(--ok-soft); }
.grande b { display: block; font-size: 14px; } .grande small { color: var(--muted); }
.rejs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.pie { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface-2); }
.fila { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 10px; } .fila:hover { background: var(--surface-2); } .fila.hij { margin-left: 30px; }
.chk { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--surface); font-size: 12px; font-weight: 800; flex: none; padding: 0; } .chk.inc { background: var(--ok); border-color: var(--ok); } .chk.exc { background: var(--bad); border-color: var(--bad); } .chk.par { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.fila .n { flex: 1; min-width: 0; font-weight: 600; } .fila .n.exc { color: var(--bad); text-decoration: line-through; } .fila small { color: var(--muted); font-size: 12px; }
.quitar-e { opacity: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; color: var(--bad); } .fila:hover .quitar-e, .fila:focus-within .quitar-e, .quitar-e.on { opacity: 1; } .quitar-e.on { background: var(--bad-soft); border-color: var(--bad); }
.caret { border: 0; background: none; display: grid; place-items: center; width: 22px; height: 22px; color: var(--muted); transition: transform .15s; } .caret[aria-expanded='true'] { transform: rotate(90deg); }
.resumen { font-size: 13.5px; line-height: 1.7; } .alerta { padding: 8px 10px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 12.5px; font-weight: 600; }
.prueba select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); margin-bottom: 6px; }
.res { padding: 9px 11px; border-radius: 12px; font-weight: 700; margin-top: 4px; } .res.si { background: var(--ok-soft); color: var(--ok); } .res.no { background: var(--bad-soft); color: var(--bad); } .res small { display: block; font-weight: 500; color: var(--fg); }
.med { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 1000px) { .marco { grid-template-columns: 1fr; } .vars { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .vars { grid-template-columns: repeat(2, 1fr); } .rej, .carriles { grid-template-columns: 1fr; } .zona { height: 460px; } .pasos .paso .t { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<div class="pag" id="app"></div>
<script>
'use strict'
const AMB = [
  ['Personal', '#3A3FA6', 'user', ['Alimentación', 'Auto', 'Compras', 'Cuidado Personal', 'Educación', 'Salud', 'Servicios', 'Transporte', 'Viajes', 'Otros']],
  ['Trabajo', '#1E8A8A', 'bag', ['Alimentación', 'Transporte', 'Herramientas y Equipamiento', 'Auto', 'Otros']],
  ['Pareja', '#8A8A2E', 'heart', ['Alimentación', 'Plan Nube', 'Transporte', 'Regalos', 'Compras', 'Salidas', 'Otros']],
  ['Familia', '#E0622F', 'users', ['Alimentación', 'Bebé', 'Hogar', 'Educación', 'Salud', 'Otros']],
  ['Amigos', '#A8478F', 'star', ['Alimentación', 'Transporte', 'Salidas', 'Regalos', 'Otros']],
]
const MED = ['Yape', 'Plin', 'Sodexo', 'Transferencia', 'Efectivo', 'Otros']
const kA = (a) => 'a:' + a, kC = (a, c) => 'c:' + a + '>' + c
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
const P = { luna: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>', sol: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>', buscar: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>', x: '<path d="m6 6 12 12M18 6 6 18"/>', mas: '<path d="M12 5v14M5 12h14"/>', der: '<path d="m9 6 6 6-6 6"/>', izq: '<path d="m15 6-6 6 6 6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>', bag: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>', heart: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>', users: '<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/>', star: '<path d="m12 3 2.6 5.6 6 .7-4.4 4.1 1.2 6L12 16.5 6.6 19.4l1.2-6L3.4 9.3l6-.7z"/>' }
const ic = (n, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`
const amb = (a) => AMB.find(([n]) => n === a)
const disco = (a) => `<span class="disco">${ic(amb(a)[2], 'g')}</span>`
let R = { cls: { [kA('Personal')]: 'inc', [kC('Trabajo', 'Alimentación')]: 'inc' }, med: { Sodexo: 'inc' } }
const E = { v: '1', q: '', abierto: new Set(['Personal']), modo: 'inc', pick: false, paso: 0, pr: { a: 'Personal', c: 'Alimentación', m: 'Sodexo' } }
const sig = (e) => (e === 'inc' ? 'exc' : e === 'exc' ? null : 'inc')
const poner = (m, k, e) => { if (e) m[k] = e; else delete m[k] }
const marcaDe = (e) => (e === 'inc' ? '✓' : e === 'exc' ? '✕' : '')
function admite(a, c, m) {
  const cl = Object.entries(R.cls), inc = cl.filter(([, e]) => e === 'inc'), exc = cl.filter(([, e]) => e === 'exc'), coin = (k) => k === kA(a) || k === kC(a, c)
  const okC = (inc.length === 0 || inc.some(([k]) => coin(k))) && !exc.some(([k]) => coin(k))
  const mi = Object.entries(R.med), mi_i = mi.filter(([, e]) => e === 'inc'), mi_e = mi.filter(([, e]) => e === 'exc')
  const okM = (mi_i.length === 0 || mi_i.some(([k]) => k === m)) && !mi_e.some(([k]) => k === m)
  return { ok: okC && okM, motivo: !okC ? (exc.some(([k]) => coin(k)) ? 'La clasificación está excluida.' : 'La clasificación no está entre las incluidas.') : !okM ? (mi_e.some(([k]) => k === m) ? 'El medio de pago está excluido.' : 'El medio de pago no está entre los incluidos.') : '' }
}
function frases() {
  const grupo = (e) => {
    const todo = AMB.filter(([a]) => R.cls[kA(a)] === e).map(([a]) => a), porCat = {}
    for (const [a, , , cats] of AMB) for (const c of cats) if (R.cls[kC(a, c)] === e) (porCat[c] ??= []).push(a)
    const out = todo.map((a) => `todo <b>${esc(a)}</b>`)
    for (const [c, as] of Object.entries(porCat)) out.push(`<b>${esc(c)}</b> <small>(${as.map(esc).join(', ')})</small>`)
    return out
  }
  const mi = Object.entries(R.med)
  return { inc: grupo('inc'), exc: grupo('exc'), minc: mi.filter(([, e]) => e === 'inc').map(([k]) => k), mexc: mi.filter(([, e]) => e === 'exc').map(([k]) => k) }
}
const nombreK = (k) => { const t = k[0], r = k.slice(2); return t === 'a' ? `Todo ${esc(r)}` : `${esc(r.split('>')[1])} <small>${esc(r.split('>')[0])}</small>` }
const tok = (k, e) => `<span class="tok ${e}"><span class="t">${nombreK(k)}</span><button class="qx" data-quitar="${esc(k)}" aria-label="Quitar regla">${ic('x')}</button></span>`
const medios = () => `<div class="med" role="group" aria-label="Medios de pago">${MED.map((m) => `<button class="tok ${R.med[m] ?? ''}" data-med="${m}" aria-label="${m}: ${R.med[m] === 'inc' ? 'incluir' : R.med[m] === 'exc' ? 'excluir' : 'sin regla'}">${R.med[m] ? `<span class="marca"><i>${marcaDe(R.med[m])}</i></span>` : ''}<span class="t">${m}</span></button>`).join('')}</div><p class="nota" style="margin:6px 0 0">Toca un medio: sin regla → <b class="inc-t">incluir</b> → <b class="exc-t">excluir</b>.</p>`

function vA() {
  const q = norm(E.q)
  return `<div class="zona"><div class="barra"><label class="buscar">${ic('buscar')}<input id="q" value="${esc(E.q)}" placeholder="Buscar categoría…" aria-label="Buscar"></label><span class="nota">Cada tarjeta es un ámbito. Toca una categoría para alternarla.</span></div><div class="sc"><div class="rej">
  ${AMB.map(([a, col, , cats]) => { const e = R.cls[kA(a)], vis = cats.filter((c) => !q || norm(c).includes(q)); if (!vis.length && q) return ''
    return `<section class="card k ${e ?? ''}" style="--k:${col}" aria-label="${esc(a)}"><header>${disco(a)}<b>${esc(a)}</b><div class="sw" role="group" aria-label="Regla para todo ${esc(a)}"><button class="n" aria-pressed="${!e}" data-poner="${esc(kA(a))}|">Nada</button><button class="i" aria-pressed="${e === 'inc'}" data-poner="${esc(kA(a))}|inc">Todo</button><button class="e" aria-pressed="${e === 'exc'}" data-poner="${esc(kA(a))}|exc">Excluir</button></div></header>
    <div class="cats">${vis.map((c) => { const ec = R.cls[kC(a, c)]; return `<button class="tok ${ec ?? ''}" data-ciclo="${esc(kC(a, c))}" aria-label="${esc(c)} en ${esc(a)}: ${ec === 'inc' ? 'incluir' : ec === 'exc' ? 'excluir' : 'sin regla'}">${ec ? `<span class="marca"><i>${marcaDe(ec)}</i></span>` : ''}<span class="t">${esc(c)}</span></button>` }).join('')}</div></section>` }).join('')}</div></div></div>`
}
function vB() {
  const lista = []
  for (const [a, , , cats] of AMB) { lista.push(['a', a, '', kA(a)]); for (const c of cats) lista.push(['c', c, a, kC(a, c)]) }
  const q = norm(E.q), vis = lista.filter(([, n, a]) => !q || norm(n + a).includes(q)).slice(0, 60)
  const toks = (e) => Object.entries(R.cls).filter(([, x]) => x === e).map(([k]) => tok(k, e)).join(' ')
  return `<div class="zona"><div class="sc"><div class="frase">Este fondo cubre ${toks('inc') || '<span class="nota">(sin reglas: todo)</span>'} <button class="mas" data-modo="inc" aria-pressed="${E.pick && E.modo === 'inc'}">${ic('mas')} añadir</button>
  <br>pero <b>no</b> cubre ${toks('exc') || '<span class="nota">nada en particular</span>'} <button class="mas" data-modo="exc" aria-pressed="${E.pick && E.modo === 'exc'}">${ic('mas')} añadir</button></div>
  ${E.pick ? `<div class="picker"><div class="barra"><b style="font-size:13px">Añadir a «${E.modo === 'inc' ? 'cubre' : 'no cubre'}»</b><label class="buscar">${ic('buscar')}<input id="q" value="${esc(E.q)}" placeholder="Escribe para filtrar…" aria-label="Filtrar"></label><button class="btn" data-modo="cerrar">Listo</button></div>
  <div class="lst">${vis.map(([t, n, a, k]) => `<button class="tok ${R.cls[k] ?? ''}" data-poner="${esc(k)}|${R.cls[k] === E.modo ? '' : E.modo}">${t === 'a' ? `Todo ${esc(n)}` : `${esc(n)} <small>${esc(a)}</small>`}</button>`).join('') || '<span class="nota">Sin resultados.</span>'}</div></div>` : ''}</div></div>`
}
function vC() {
  const q = norm(E.q), items = []
  for (const [a, , , cats] of AMB) { items.push([kA(a), `Todo ${a}`, '', a]); for (const c of cats) items.push([kC(a, c), c, a, a]) }

function vD() {

function vE() {

const VAR = [['1', 'Tarjetas por ámbito', 'Una tarjeta de color por ámbito con sus categorías.'], ['2', 'Frase', 'Lo lees como una oración y añades piezas.'], ['3', 'Carriles', 'Arrastra fichas: sin regla, cubre, no cubre.'], ['4', 'Asistente', 'Tres pasos cortos, de lo general a lo particular.'], ['5', 'Árbol con casillas', 'Como un explorador de archivos, con «excepto».']]

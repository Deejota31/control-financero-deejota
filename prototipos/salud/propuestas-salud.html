<style>

.gasto b { display: block; } .gasto small { color: var(--muted); display: block; } .gasto .monto { font-size: 18px; font-weight: 800; margin-top: 2px; } mark { background: var(--warn-soft); color: inherit; border-radius: 4px; padding: 0 3px; }

.timeline { position: relative; padding-left: 18px; } .timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--line); } .tl { position: relative; padding: 0 0 12px; } .tl::before { content: ''; position: absolute; left: -17px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--pri); border: 2px solid var(--surface); } .tl.bad::before { background: var(--bad); } .tl.warn::before { background: var(--warn); } .tl.ok::before { background: var(--ok); }
.tabla { width: 100%; border-collapse: collapse; } .tabla th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; } .tabla td { padding: 8px; border-top: 1px solid var(--line); } .tabla .r { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; } svg text { fill: var(--muted); font-size: 11px; }

@media (max-width: 600px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } .dup { grid-template-columns: 1fr; } .dup .vs { display: none; } .pilares { grid-template-columns: repeat(2, 1fr); } .heat { grid-template-columns: 22px repeat(31, 1fr); gap: 2px; } }

<script>
'use strict'
const S = (n) => 'S/ ' + n.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const toast = (t) => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800) }
const TEMAS = [['resumen', '🩺', 'Resumen'], ['calidad', '🧪', 'Calidad del dato'], ['duplicados', '👯', 'Duplicados'], ['anomalias', '⚡', 'Anomalías'], ['recurrentes', '🔁', 'Recurrentes'], ['proyeccion', '📈', 'Proyección'], ['habitos', '🗓️', 'Hábitos']]
let E = { t: 'resumen', cal: 'todos', fecha: 'mes' }
/* ---- datos de ejemplo ---- */
const CAL = [
  { id: 1, sev: 'bad', tipo: 'sin-cat', titulo: 'Gastos sin subcategoría', det: 'Categorías con subcategorías definidas pero el gasto no usa ninguna.', n: 12, monto: 486.5, ej: 'Compras · Servicios · Alimentación', fix: 'Asignar en lote' },
  { id: 2, sev: 'bad', tipo: 'sin-medio', titulo: 'Gastos sin medio de pago', det: 'No se puede calcular qué fondos los cubren ni el saldo por medio.', n: 5, monto: 212, ej: '3 de Familia · 2 de Pareja', fix: 'Asignar medio' },
  { id: 3, sev: 'warn', tipo: 'desc', titulo: 'Descripciones genéricas', det: '«gasto», «varios», «compra» o muy cortas (menos de 4 letras).', n: 18, monto: 733.9, ej: '«varios» ×7 · «compra» ×6 · «x» ×2', fix: 'Revisar y renombrar' },
  { id: 4, sev: 'warn', tipo: 'otros', titulo: 'Demasiado en «Otros»', det: 'La categoría «Otros» concentra el 14 % del gasto del mes; suele esconder gastos clasificables.', n: 21, monto: 904.2, ej: 'Otros de Personal (9) · Otros de Familia (7)', fix: 'Reclasificar' },
  { id: 5, sev: 'warn', tipo: 'fecha', titulo: 'Fechas poco probables', det: 'Gastos con fecha de fin de semana a las 00:00 o con más de 60 días de antigüedad registrados hoy.', n: 4, monto: 98, ej: 'Registrados hoy con fecha de hace 2 meses', fix: 'Verificar' },
  { id: 6, sev: 'ok', tipo: 'huerfano', titulo: 'Sin fondo asignado', det: 'Todos los gastos del mes tienen fondo. Cobertura completa.', n: 0, monto: 0, ej: '', fix: '' },
]
const DUP = [
  { id: 1, p: 96, a: { d: 'Almuerzo menú ejecutivo', f: '14 oct · 13:05', c: 'Trabajo › Alimentación', m: 'Sodexo', v: 18 }, b: { d: 'Almuerzo menu ejecutivo', f: '14 oct · 13:07', c: 'Trabajo › Alimentación', m: 'Sodexo', v: 18 }, dif: [] },
  { id: 2, p: 88, a: { d: 'Recarga Yape celular', f: '09 oct', c: 'Personal › Servicios', m: 'Yape', v: 30 }, b: { d: 'Recarga celular', f: '09 oct', c: 'Personal › Servicios', m: 'Plin', v: 30 }, dif: ['m'] },
  { id: 3, p: 74, a: { d: 'Supermercado Plaza Vea', f: '03 oct', c: 'Familia › Alimentación', m: 'Transferencia', v: 214.8 }, b: { d: 'Supermercado Plaza Vea', f: '04 oct', c: 'Familia › Hogar', m: 'Transferencia', v: 214.8 }, dif: ['f', 'c'] },
]
const ANOM = [
  { sev: 'bad', t: 'Gasto 4,1 veces mayor que lo habitual', d: 'Salud › Consulta · S/ 640,00 (tu promedio en esa categoría es S/ 156)', k: 'Salud', v: 640, prom: 156 },
  { sev: 'warn', t: 'Alimentación de Pareja subió 62 % frente a tu promedio', d: 'S/ 520 este mes vs S/ 321 de promedio de los últimos 3 meses', k: 'Pareja', v: 520, prom: 321 },
  { sev: 'warn', t: 'Tres compras seguidas en el mismo comercio en un día', d: 'Bodega Don Lucho · 3 gastos entre 18:10 y 19:02 · S/ 87,50', k: 'Compras', v: 87.5, prom: 40 },
  { sev: 'ok', t: 'Transporte bajó 28 %', d: 'S/ 130 este mes vs S/ 181 de promedio. Buen ritmo.', k: 'Transporte', v: 130, prom: 181 },
]
const REC = [
  { n: 'Netflix', c: 'Personal › Servicios', v: 44.9, dia: 5, est: 'ok', ult: 'pagado 05 oct', nota: '' },
  { n: 'Plan Nube (pareja)', c: 'Pareja › Plan Nube', v: 12.9, dia: 8, est: 'ok', ult: 'pagado 08 oct', nota: '' },
  { n: 'Gimnasio', c: 'Personal › Cuidado Personal', v: 129, dia: 12, est: 'warn', ult: 'sin registrar este mes', nota: 'Suele pagarse el 12' },
  { n: 'Spotify', c: 'Personal › Servicios', v: 19.9, dia: 3, est: 'bad', ult: 'subió de S/ 16,90 a S/ 19,90', nota: 'Aumento detectado' },
  { n: 'Seguro del auto', c: 'Trabajo › Auto', v: 168, dia: 20, est: 'next', ult: 'vence en 3 días', nota: '' },
]
const FONDOS = [['General', 1200, 1710, 'var(--c1)'], ['Sodexo', 280, 262, 'var(--c3)'], ['Hogar', 900, 612, 'var(--c2)'], ['Pareja', 400, 468, 'var(--c4)'], ['Movilidad', 300, 120, 'var(--c5)']]
const ic = (e, c = '') => `<span class="ico ${c}" aria-hidden="true">${e}</span>`

/* ---- Resumen ---- */
function vResumen() {
  const pts = 78, r = 54, c = 2 * Math.PI * r
  const prm = [['Calidad del dato', 82], ['Control de fondos', 71], ['Estabilidad', 85], ['Ahorro / holgura', 74]]
  return `<div class="grid"><div class="card hero"><div class="anillo"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * pts) / 100} ${c}"/></svg><b>${pts}</b><small>de 100</small></div>
    <div><span class="eyebrow" style="color:inherit;opacity:.8">Puntaje de salud · octubre 2026</span><h2>Vas bien: 4 puntos más que el mes pasado</h2><p class="sub" style="margin:0">El puntaje combina cuatro pilares. Lo que más te frena hoy: <b>gastos sin clasificar</b> y el fondo <b>General en negativo</b>.</p><div class="pilares">${prm.map(([n, v]) => `<div class="pilar"><b>${v}</b><span>${n}</span></div>`).join('')}</div></div></div>
  <div class="grid g4">${[['Gastos del mes', S(4318.4), '+6 % vs promedio', 'warn'], ['Cobertura por fondos', '94 %', '3 gastos sin fondo', 'warn'], ['Registros completos', '82 %', '+3 pts', 'ok'], ['Días al cierre', '5', 'Proyección: dentro de lo previsto', 'ok']].map(([a, b, c, k]) => `<div class="card kpi"><span class="eyebrow">${a}</span><b>${b}</b><span class="d ${k}">${c}</span></div>`).join('')}</div>
  <div class="grid g2"><div class="card"><h2>Qué hacer primero</h2><p class="sub">Ordenado por impacto en tu puntaje.</p><div class="lista">
    <div class="item">${ic('🧪', 'bad')}<div class="t"><b>Clasifica 12 gastos sin subcategoría</b><small>+5 puntos · 3 minutos</small></div><button class="btn sm pri" data-ir="calidad">Resolver</button></div>
    <div class="item">${ic('👯', 'warn')}<div class="t"><b>Revisa 3 posibles duplicados</b><small>Podrías estar contando S/ 262,80 de más</small></div><button class="btn sm pri" data-ir="duplicados">Revisar</button></div>
    <div class="item">${ic('📈', 'warn')}<div class="t"><b>El fondo Pareja cerrará S/ 68 sobre su presupuesto</b><small>Al ritmo actual</small></div><button class="btn sm pri" data-ir="proyeccion">Ver</button></div>
    <div class="item">${ic('🔁', 'ok')}<div class="t"><b>Spotify subió de precio</b><small>+S/ 3,00 al mes · S/ 36 al año</small></div><button class="btn sm" data-ir="recurrentes">Ver</button></div></div></div>
  <div class="card"><h2>Evolución del puntaje</h2><p class="sub">Últimos 6 meses.</p>${linea([61, 66, 64, 70, 74, 78], ['may', 'jun', 'jul', 'ago', 'sep', 'oct'])}</div></div></div>`
}
function linea(vs, et) {
  const W = 420, H = 150, p = 24, mx = Math.max(...vs) + 8, mn = Math.min(...vs) - 8
  const X = (i) => p + (i * (W - 2 * p)) / (vs.length - 1), Y = (v) => H - p - ((v - mn) / (mx - mn)) * (H - 2 * p)
  const d = vs.map((v, i) => `${i ? 'L' : 'M'}${X(i)},${Y(v)}`).join(' ')
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del puntaje: ${vs.join(', ')}"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--pri)" stop-opacity=".28"/><stop offset="1" stop-color="var(--pri)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${X(vs.length - 1)},${H - p} L${X(0)},${H - p}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vs.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="var(--surface)" stroke="var(--pri)" stroke-width="2.5"/><text x="${X(i)}" y="${Y(v) - 10}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${v}</text><text x="${X(i)}" y="${H - 6}" text-anchor="middle">${et[i]}</text>`).join('')}</svg></div>`
}
/* ---- Calidad ---- */
function vCalidad() {
  const f = E.cal, lst = CAL.filter((c) => f === 'todos' || c.sev === f), pend = CAL.filter((c) => c.sev !== 'ok')
  const tot = pend.reduce((a, c) => a + c.n, 0)
  return `<div class="grid g-67"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>Calidad del dato</h2><p class="sub">Qué tan completos y confiables son tus registros de octubre.</p></div><div class="chips" role="group" aria-label="Filtrar">${[['todos', 'Todos'], ['bad', 'Críticos'], ['warn', 'Mejorables'], ['ok', 'Correctos']].map(([k, n]) => `<button class="chip" data-cal="${k}" aria-pressed="${f === k}">${n}</button>`).join('')}</div></div>
  <div class="lista">${lst.map((c) => `<div class="item">${ic(c.sev === 'ok' ? '✅' : c.sev === 'bad' ? '⛔' : '⚠️', c.sev)}<div class="t"><b>${c.titulo} ${c.n ? `<span class="pill ${c.sev}">${c.n} gastos</span>` : ''}</b><small>${c.det}</small>${c.ej ? `<small>Ej.: ${c.ej}</small>` : ''}</div>${c.n ? `<div style="text-align:right"><b>${S(c.monto)}</b><br><button class="btn sm" data-toast="Abriría «${c.fix}» con los ${c.n} gastos filtrados">${c.fix}</button></div>` : ''}</div>`).join('')}</div></div>
  <div style="display:flex;flex-direction:column;gap:14px"><div class="card"><h2>Completitud por campo</h2><p class="sub">Porcentaje de gastos con el dato completo.</p><div class="lista">${[['Fondo asignado', 100], ['Categoría', 100], ['Subcategoría', 87], ['Medio de pago', 94], ['Descripción útil', 81], ['Notas / comprobante', 23]].map(([n, v]) => `<div><div style="display:flex;justify-content:space-between"><b>${n}</b><span class="${v > 90 ? 'ok' : v > 60 ? 'warn' : 'bad'}">${v} %</span></div><div class="barra"><i style="width:${v}%;background:var(--${v > 90 ? 'ok' : v > 60 ? 'warn' : 'bad'})"></i></div></div>`).join('')}</div></div>
  <div class="card"><h2>${tot} gastos por mejorar</h2><p class="sub">Equivale al 11 % de los registros del mes.</p><button class="btn pri" data-toast="Abriría el asistente: un gasto a la vez, con sugerencias">Corregir uno por uno</button></div></div></div>`
}
/* ---- Duplicados ---- */
function vDup() {
  const cmp = (g, o, k) => (o.dif.includes(k) ? `<mark>${g[k === 'f' ? 'f' : k === 'c' ? 'c' : 'm']}</mark>` : g[k === 'f' ? 'f' : k === 'c' ? 'c' : 'm'])
  const gasto = (g, o) => `<div class="gasto ${o.dif.length ? 'dif' : ''}" style="${o.dif.length ? '' : ''}"><b>${esc(g.d)}</b><small>${cmp(g, o, 'f')} · ${cmp(g, o, 'c')}</small><small>${cmp(g, o, 'm')}</small><div class="monto">${S(g.v)}</div></div>`
  if (!DUP.length) return `<div class="card" style="text-align:center;padding:48px"><h2>Sin duplicados pendientes 🎉</h2><p class="sub">Revisaremos de nuevo cuando registres más gastos.</p></div>`
  return `<div class="grid"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h2>Posibles duplicados</h2><p class="sub" style="margin:0">Detectados por monto, fecha cercana, comercio y descripción parecida. Impacto potencial: <b>${S(DUP.reduce((a, d) => a + d.a.v, 0))}</b>.</p></div><span class="pill pri">${DUP.length} grupos</span></div></div>
  ${DUP.map((o) => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap"><b>Coincidencia ${o.p} %</b><span class="pill ${o.p > 90 ? 'bad' : 'warn'}">${o.p > 90 ? 'Casi seguro' : 'Revisar'}</span></div><div class="dup">${gasto(o.a, o)}<div class="vs">vs</div>${gasto(o.b, o)}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri sm" data-dup="${o.id}|Fusionados: se conserva el primero y se anula el segundo (queda en auditoría)">Es duplicado · anular el segundo</button><button class="btn sm" data-dup="${o.id}|Marcado como «no es duplicado»; no volverá a avisar">No es duplicado</button><button class="btn sm" data-toast="Abriría ambos gastos para compararlos">Abrir ambos</button></div></div>`).join('')}</div>`
}
/* ---- Anomalías ---- */
function vAnom() {
  return `<div class="grid g-67"><div class="card"><h2>Cosas fuera de lo común</h2><p class="sub">Comparado con tu historial de los últimos 3 meses (mediana y desviación por categoría).</p><div class="lista">${ANOM.map((a) => { const mx = Math.max(a.v, a.prom); return `<div class="item" style="align-items:flex-start">${ic(a.sev === 'ok' ? '👍' : a.sev === 'bad' ? '🚨' : '🔎', a.sev)}<div class="t"><b>${a.t}</b><small>${a.d}</small><div style="margin-top:8px;display:grid;gap:4px"><div class="barra" title="Este mes"><i style="width:${(a.v / mx) * 100}%;background:var(--${a.sev === 'ok' ? 'ok' : a.sev})"></i></div><div class="barra" title="Promedio"><i style="width:${(a.prom / mx) * 100}%;background:var(--muted);opacity:.5"></i></div></div></div></div>` }).join('')}</div></div>
  <div class="card"><h2>Sensibilidad</h2><p class="sub">Cuánto debe desviarse un gasto para avisarte.</p><div class="chips" role="group" aria-label="Sensibilidad">${['Baja', 'Media', 'Alta'].map((n, i) => `<button class="chip" data-toast="Sensibilidad: ${n}" aria-pressed="${i === 1}">${n}</button>`).join('')}</div><p class="sub">Con «Media» avisamos cuando un gasto supera 2,5 veces lo habitual de su categoría o una categoría sube más de 40 %.</p></div></div>`
}
/* ---- Recurrentes ---- */
function vRec() {
  const tot = REC.reduce((a, r) => a + r.v, 0)
  const est = { ok: ['✓ al día', 'ok'], warn: ['⏳ pendiente', 'warn'], bad: ['▲ subió', 'bad'], next: ['📅 próximo', 'pri'] }
  return `<div class="grid g-67"><div class="card"><h2>Gastos que se repiten</h2><p class="sub">Detectados solos a partir de tu historial (mismo comercio, monto y día parecido).</p><div class="lista">${REC.map((r) => `<div class="item">${ic('🔁', r.est === 'bad' ? 'bad' : r.est === 'warn' ? 'warn' : '')}<div class="t"><b>${r.n}</b><small>${r.c} · día ${r.dia} · ${r.ult}</small></div><div style="text-align:right"><b>${S(r.v)}</b><br><span class="pill ${est[r.est][1]}">${est[r.est][0]}</span></div></div>`).join('')}</div></div>
  <div style="display:flex;flex-direction:column;gap:14px"><div class="card kpi"><span class="eyebrow">Costo fijo mensual</span><b>${S(tot)}</b><small>${S(tot * 12)} al año</small></div><div class="card"><h2>Próximos 14 días</h2><div class="timeline"><div class="tl warn"><b>12 oct · Gimnasio</b><br><small>S/ 129,00 · aún sin registrar</small></div><div class="tl"><b>20 oct · Seguro del auto</b><br><small>S/ 168,00 · sale de «Movilidad»</small></div><div class="tl ok"><b>28 oct · Cierre de período</b><br><small>Los fondos se congelan</small></div></div><button class="btn sm pri" data-toast="Abriría «Registrar mensuales» con los pendientes marcados">Registrar pendientes</button></div></div></div>`
}
/* ---- Proyección ---- */
function vProy() {
  return `<div class="grid"><div class="card"><h2>Cierre proyectado por fondo</h2><p class="sub">Si sigues gastando al ritmo de los últimos días, así cerrará cada fondo. Marca = presupuesto.</p><div class="lista">${FONDOS.map(([n, pres, proy, col]) => { const max = Math.max(pres, proy) * 1.12, pct = (proy / pres) * 100, k = pct > 100 ? 'bad' : pct > 85 ? 'warn' : 'ok'
    return `<div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${n}</b><span><span class="pill ${k}">${pct > 100 ? `+${S(proy - pres)} sobre` : `${S(pres - proy)} libres`}</span> <span style="color:var(--muted)">proyecta ${S(proy)} de ${S(pres)}</span></span></div><div style="position:relative;height:16px;margin-top:6px;border-radius:99px;background:var(--surface-2)"><div style="height:100%;width:${(proy / max) * 100}%;border-radius:99px;background:${col};opacity:${pct > 100 ? 1 : .85}"></div><div style="position:absolute;top:-4px;bottom:-4px;left:${(pres / max) * 100}%;width:3px;background:var(--fg);border-radius:2px" title="Presupuesto"></div></div></div>` }).join('')}</div></div>
  <div class="grid g2"><div class="card"><h2>Ritmo de gasto del mes</h2><p class="sub">Acumulado real vs. ritmo ideal.</p>${acum()}</div><div class="card"><h2>Simulador «¿y si…?»</h2><p class="sub">Prueba un cambio y mira el efecto en el cierre.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${[['Reducir 20 % en Salidas', 90], ['Mover S/ 100 de Hogar a Pareja', 100], ['Pausar Gimnasio', 129]].map(([n, v]) => `<button class="chip" data-sim="${v}|${n}">${n}</button>`).join('')}</div><div class="item" id="sim"><div class="t"><b>Elige una opción</b><small>Veremos cuánto mejora el fondo General.</small></div></div></div></div></div>`
}
function acum() {
  const W = 420, H = 150, p = 22, N = 31, real = [], ideal = []
  let a = 0; for (let d = 1; d <= 26; d++) { a += 120 + ((d * 37) % 90) + (d % 7 === 0 ? 160 : 0); real.push(a) }
  for (let d = 1; d <= N; d++) ideal.push((4000 / N) * d)
  const mx = 4600, X = (d) => p + ((d - 1) / (N - 1)) * (W - 2 * p), Y = (v) => H - p - (v / mx) * (H - 2 * p)
  const ln = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${X(i + 1)},${Y(v)}`).join(' ')
  const proy = `M${X(26)},${Y(real[25])} L${X(31)},${Y(real[25] + (real[25] / 26) * 5)}`
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto acumulado del mes frente al ritmo ideal"><path d="${ln(ideal)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/><path d="${ln(real)}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round"/><path d="${proy}" fill="none" stroke="var(--bad)" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/><text x="${p}" y="${H - 5}">1</text><text x="${X(15)}" y="${H - 5}">15</text><text x="${X(31) - 8}" y="${H - 5}">31</text><text x="${X(26) - 80}" y="${Y(real[25]) - 8}" style="fill:var(--fg);font-weight:700">${S(real[25])} al día 26</text></svg></div><p class="sub" style="margin-top:6px">Línea punteada gris: ritmo ideal (S/ 4 000). Roja: proyección al día 31.</p>`
}
/* ---- Hábitos ---- */
function vHab() {
  const dias = ['L', 'M', 'X', 'J', 'V', 'S', 'D'], n = 26
  const cel = []; for (let d = 1; d <= 31; d++) cel.push(d > n ? 'fut' : (Math.round(Math.abs(Math.sin(d * 1.7)) * 70) + (d % 7 === 5 || d % 7 === 6 ? 25 : 0)))
  const sem = [['Lun', 38], ['Mar', 45], ['Mié', 52], ['Jue', 61], ['Vie', 88], ['Sáb', 100], ['Dom', 70]]
  return `<div class="grid"><div class="card"><h2>Calendario de gasto</h2><p class="sub">Cada cuadro es un día de octubre; más intenso = más gasto.</p><div class="heat" aria-label="Mapa de calor de octubre"><span></span>${cel.map((v, i) => `<i class="${v === 'fut' ? 'fut' : ''}" style="--v:${v === 'fut' ? 0 : v}" title="${i + 1} oct${v === 'fut' ? '' : ': ' + S(v * 4)}"></i>`).join('')}</div></div>
  <div class="grid g3"><div class="card"><h2>Día de la semana</h2><p class="sub">Dónde se concentra tu gasto.</p><div class="lista">${sem.map(([n, v]) => `<div style="display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center"><b>${n}</b><div class="barra"><i style="width:${v}%"></i></div><span style="color:var(--muted)">${v}%</span></div>`).join('')}</div></div>
  <div class="card"><h2>Quién gasta más</h2><p class="sub">Por ámbito este mes.</p><div class="lista">${[['Personal', 1480, 'var(--c1)'], ['Familia', 1210, 'var(--c3)'], ['Pareja', 868, 'var(--c5)'], ['Trabajo', 540, 'var(--c2)'], ['Amigos', 220, 'var(--c4)']].map(([n, v, c]) => `<div><div style="display:flex;justify-content:space-between"><b>${n}</b><span>${S(v)}</span></div><div class="barra"><i style="width:${(v / 1480) * 100}%;background:${c}"></i></div></div>`).join('')}</div></div>
  <div class="card"><h2>Rachas y logros</h2><p class="sub">Para mantener el hábito.</p><div class="lista"><div class="item">${ic('🔥', 'ok')}<div class="t"><b>9 días seguidos registrando</b><small>Tu mejor racha: 21</small></div></div><div class="item">${ic('🎯', 'ok')}<div class="t"><b>3 fondos dentro de presupuesto</b><small>de 5 específicos</small></div></div><div class="item">${ic('🧹', '')}<div class="t"><b>Cero gastos sin fondo</b><small>Hace 2 meses que lo mantienes</small></div></div></div></div></div></div>`
}
const VIEW = { resumen: vResumen, calidad: vCalidad, duplicados: vDup, anomalias: vAnom, recurrentes: vRec, proyeccion: vProy, habitos: vHab }
const tema = () => { const t = document.documentElement.dataset.theme; return t ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }
function dibujar() {
  const bad = { calidad: CAL.filter((c) => c.sev === 'bad').length, duplicados: DUP.length }
  document.getElementById('app').innerHTML = `<header class="cab"><div><h1>Salud financiera · propuestas</h1><p>Maqueta independiente con datos de ejemplo para explorar cómo podría crecer esta pestaña. No modifica la aplicación ni guarda nada: los botones solo simulan el resultado.</p></div><button class="btn" id="tema" aria-label="Cambiar tema">${tema() === 'dark' ? '☀️ Claro' : '🌙 Oscuro'}</button></header>
  <div class="tabs" role="tablist" aria-label="Secciones">${TEMAS.map(([k, i, n]) => `<button class="tab" role="tab" data-t="${k}" aria-selected="${E.t === k}">${i} ${n}${bad[k] ? ` <span class="n">${bad[k]}</span>` : ''}</button>`).join('')}</div>
  <main role="tabpanel">${VIEW[E.t]()}</main>`
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-t],[data-ir],[data-cal],[data-toast],[data-dup],[data-sim],#tema'); if (!b) return
  if (b.id === 'tema') { document.documentElement.dataset.theme = tema() === 'dark' ? 'light' : 'dark'; return dibujar() }
  if (b.dataset.t) E.t = b.dataset.t
  if (b.dataset.ir) E.t = b.dataset.ir
  if (b.dataset.cal) E.cal = b.dataset.cal
  if (b.dataset.toast) return toast(b.dataset.toast)
  if (b.dataset.dup) { const [id, msg] = b.dataset.dup.split('|'); DUP.splice(DUP.findIndex((d) => d.id == id), 1); toast(msg) }
  if (b.dataset.sim) { const [v, n] = b.dataset.sim.split('|'); dibujar(); const s = document.getElementById('sim'); s.innerHTML = `<div class="t"><b>${n}</b><small>El fondo General cerraría en ${S(1710 - Number(v))} en vez de ${S(1710)} (${S(Number(v))} menos de gasto).</small></div><span class="pill ok">+${S(Number(v))}</span>`; return }
  dibujar()
})
dibujar()
</script>

<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo B · Explorador jerárquico</title>
<link rel="stylesheet" href="shared.css">
<style>
  .split { display: grid; grid-template-columns: 400px 1fr; gap: 18px; margin-top: 18px; align-items: start; }
  .arbol { padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .busca { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; color: var(--muted); }
  .busca input { border: 0; background: none; outline: none; flex: 1; }
  .nodo { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 10px; background: none; text-align: left; }
  .nodo:hover { background: var(--surface-2); }
  .nodo[aria-selected='true'] { background: var(--pri-soft); border-color: var(--pri); }
  .nodo .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
  .nodo.off { opacity: .55; }
  .hijos { margin-left: 22px; padding-left: 8px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .12s; } .chev[data-abierto='true'] { transform: rotate(90deg); }
  .detalle { padding: 22px; display: flex; flex-direction: column; gap: 18px; min-height: 520px; }
  .det-cab { display: flex; gap: 16px; align-items: center; } .det-cab h2 { font-size: 22px; }
  .rutas { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .dato { padding: 12px; border: 1px solid var(--line); border-radius: 12px; } .dato small { color: var(--muted); display: block; } .dato b { font-size: 18px; }
  .tonos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tono { border-radius: 12px; border: 1px solid var(--line); padding: 12px; } .tono.claro { background: #fff; color: #17172b; } .tono.oscuro { background: #181829; color: #ececf8; }
  .tono .fila { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .acciones { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
  .resumen-amb { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .res { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; }
  .res:hover { border-color: var(--pri); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
  barraPrototipo('B · Explorador jerárquico')
  marcoApp('Catálogo', 'Navega por el árbol y edita cada elemento en su panel.', '<button class="btn btn-pri" data-nuevo="ambito">' + ui('mas') + ' Nuevo ámbito</button>')
  let vista = param('vista') || 'ambitos'
  let sel = vista === 'ambitos' ? { tipo: 'ambito', id: 'a1' } : vista === 'medios' ? { tipo: 'medio', id: 'm1' } : { tipo: 'categoria', id: 'c2' }
  const abiertos = new Set(['a1', 'c2'])

  const nodoTree = (item, tipo, hijos, nivelAbierto) => {
    const c = colorEfectivo(item, tipo)
    const abierto = abiertos.has(item.id)
    return `<div><button class="nodo ${item.activo ? '' : 'off'}" role="treeitem" aria-selected="${sel.id === item.id}" ${hijos ? `aria-expanded="${abierto}"` : ''} data-sel="${item.id}" data-tselt="${tipo}" style="${estiloColor(c.hex)}">
      ${hijos ? `<span class="chev" data-abierto="${abierto}" data-toggle="${item.id}">${ui('flecha', 'chev')}</span>` : '<span style="width:18px"></span>'}
      <span class="insignia p">${svg(item.icono)}</span><span>${esc(item.nombre)}</span>${item.activo ? '' : '<span class="estado off">Inactivo</span>'}<span class="cnt num">${item.gastos}</span></button>
      ${hijos && abierto ? `<div class="hijos" role="group">${hijos}</div>` : ''}</div>`
  }
  const arbol = () => {
    return DATOS.ambitos.map((a) => nodoTree(a, 'ambito', a.fijoAlFinal && !DATOS.categorias.some((c) => c.ambito === a.id && !c.fijoAlFinal) ? '' : DATOS.categorias.filter((c) => c.ambito === a.id).map((c) => nodoTree(c, 'categoria', c.subs.length ? c.subs.map((s) => `<button class="nodo" data-sub="${esc(s)}" data-padre="${c.id}" style="${estiloColor(colorEfectivo(c, 'categoria').hex)}"><span class="punto"></span><span>${esc(s)}</span></button>`).join('') : '')).join('') || '')).join('')
  }

  function detalle() {
    if (vista === 'medios') return ''
    const lista = listaDe(sel.tipo), item = lista.find((x) => x.id === sel.id)
    if (!item) return '<p>Selecciona un elemento.</p>'
    const c = colorEfectivo(item, sel.tipo), i = lista.indexOf(item)
    const el = eliminable(item, sel.tipo)
    const padre = sel.tipo === 'categoria' ? DATOS.ambitos.find((a) => a.id === item.ambito) : null
    return `<section class="tarjeta detalle" data-id="${item.id}" data-tipo="${sel.tipo}" aria-label="Detalle de ${esc(item.nombre)}">
      <div class="rutas">${padre ? `${esc(padre.nombre)} ${ui('flecha')}` : sel.tipo === 'ambito' ? 'Ámbito' : ''} <b>${esc(item.nombre)}</b></div>
      <div class="det-cab">${insignia(item, sel.tipo, 'g')}<div><h2>${esc(item.nombre)}</h2><span class="pildora" style="${estiloColor(c.hex)}"><span class="punto"></span> ${nombreColor(c.hex)} · ${c.hex.toUpperCase()}</span> ${c.origen === 'heredado' ? `<span class="origen">${ui('enlace')} hereda de ${esc(c.de)}</span>` : ''}</div><span style="margin-left:auto">${interruptor(item.activo, item.nombre, item.fijoAlFinal)}</span></div>
      <div class="datos"><div class="dato"><small>Gastos asociados</small><b class="num">${item.gastos}</b></div><div class="dato"><small>Posición</small><b class="num">${i + 1} de ${lista.length}</b></div><div class="dato"><small>Estado</small><b>${item.activo ? 'Activo' : 'Inactivo'}</b></div></div>
      <div><h3 style="font-size:14px;margin-bottom:8px">Cómo se ve</h3><div class="tonos">${['claro', 'oscuro'].map((t) => { const k = tonos(c.hex, t); return `<div class="tono ${t}"><small>${t === 'claro' ? 'Tema claro' : 'Tema oscuro'}</small><div class="fila"><span class="insignia" style="--k-soft:${k.soft};--k-borde:${k.borde};--k-icono:${k.icono}">${svg(item.icono)}</span><b style="color:${k.texto}">${esc(item.nombre)}</b><span class="pildora" style="--k-soft:${k.soft};--k-borde:${k.borde};--k-texto:${k.texto}">S/ 128.50</span></div></div>` }).join('')}</div></div>
      ${sel.tipo === 'categoria' ? `<div><h3 style="font-size:14px;margin-bottom:8px">Subcategorías (${item.subs.length})</h3><div class="meta" style="display:flex;gap:6px;flex-wrap:wrap">${item.subs.map((s) => `<span class="pildora neutra">${esc(s)}</span>`).join('') || '<span class="origen">Sin subcategorías</span>'}</div></div>` : ''}
      <div class="acciones"><button class="btn btn-pri" data-accion="editar">${ui('editar')} Editar…</button>${botonesFila(item, sel.tipo, i, lista.length)}<span class="candado">${item.fijoAlFinal ? `${ui('candado')} Siempre al final` : esc(el.motivo)}</span></div>
    </section>`
  }

  function dibujar() {
    const v = document.getElementById('vista')
    let html = pestanas(vista)
    if (vista === 'ambitos') {
      html += `<div class="split"><div class="tarjeta arbol" role="tree" aria-label="Catálogo"><div class="busca">${ui('buscar')}<input placeholder="Buscar en el catálogo…" aria-label="Buscar"></div>${DATOS.ambitos.map((a) => nodoTree(a, 'ambito', '')).join('')}</div>
${detalle()}</div>`
    } else if (vista === 'categorias') {
      html += `<div class="split"><div class="tarjeta arbol" role="tree" aria-label="Catálogo"><div class="busca">${ui('buscar')}<input placeholder="Buscar en el catálogo…" aria-label="Buscar"></div>${arbol()}
        <div style="display:flex;gap:8px;padding:8px 4px 0"><button class="btn" data-nuevo="categoria">${ui('mas')} Categoría</button><button class="btn">${ui('mas')} Subcategoría</button></div></div>${detalle()}</div>`
    } else {
      const L = DATOS.medios
      if (sel.tipo !== 'medio') sel = { tipo: 'medio', id: 'm1' }
      html += `<div class="split"><div class="tarjeta arbol" role="listbox" aria-label="Medios de pago"><div class="busca">${ui('buscar')}<input placeholder="Buscar medio de pago…" aria-label="Buscar"></div>${L.map((m) => nodoTree(m, 'medio', '')).join('')}<div style="padding:8px 4px 0"><button class="btn" data-nuevo="medio">${ui('mas')} Nuevo medio de pago</button></div></div>${(() => { const t = vista; vista = 'x'; const d = detalle(); vista = t; return d })()}</div>`
    }
    v.innerHTML = html
    v.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => { vista = b.dataset.vista; if (vista === 'categorias') sel = { tipo: 'categoria', id: 'c2' }; if (vista === 'ambitos') sel = { tipo: 'ambito', id: 'a1' }; dibujar() }))
    v.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', (e) => {
      const id = b.dataset.sel
      if (e.target.closest('[data-toggle]')) { abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); dibujar(); return }
      sel = { tipo: b.dataset.tselt, id }
                  dibujar()
    }))
    v.querySelectorAll('[data-sub]').forEach((b) => b.addEventListener('click', () => { sel = { tipo: 'categoria', id: b.dataset.padre }; dibujar() }))
  }
  manejarAcciones(document.getElementById('vista'), dibujar)
  document.querySelector('.cab-pagina [data-nuevo]').addEventListener('click', () => abrirModal({ tipo: 'ambito', onGuardar: dibujar }))
  document.addEventListener('tema', dibujar)
  dibujar()
</script>
</body>
</html>

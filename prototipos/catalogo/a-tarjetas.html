<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo A · Tarjetas visuales</title>
<link rel="stylesheet" href="shared.css">
<style>
  .rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--k-base); }
  .card.inactiva { opacity: .62; }
  .card-cab { display: flex; gap: 14px; align-items: center; }
  .card-cab h3 { font-size: 17px; } .card-cab small { color: var(--muted); display: block; }
  .card-cab .sw { margin-left: auto; }
  .card-pie { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin: 0 -4px; }
  .card-acc { display: flex; gap: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .nuevo { display: grid; place-items: center; gap: 6px; min-height: 160px; border: 2px dashed var(--line); border-radius: 16px; background: transparent; color: var(--muted); font-weight: 600; }
  .nuevo:hover { border-color: var(--pri); color: var(--pri); }
  .grupo { margin-top: 26px; } .grupo-cab { display: flex; align-items: center; gap: 12px; } .grupo-cab h2 { font-size: 16px; }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; }
  .fijo { background: var(--surface-2); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
  barraPrototipo('A · Tarjetas visuales')
  marcoApp('Catálogo', 'Ámbitos, categorías y medios de pago de tu hogar.', '')
  let vista = param('vista') || 'ambitos'

  const tarjeta = (item, tipo, i, total, cuerpo) => {
    const c = colorEfectivo(item, tipo)
    const bloqueado = item.fijoAlFinal
    return `<article class="card ${item.activo ? '' : 'inactiva'} ${bloqueado ? 'fijo' : ''}" data-id="${item.id}" data-tipo="${tipo}" style="${estiloColor(c.hex)}" aria-label="${esc(item.nombre)}">
      <div class="card-cab">${insignia(item, tipo, 'g')}<div><h3>${esc(item.nombre)}</h3><small class="num">${item.gastos} gastos</small></div>${interruptor(item.activo, item.nombre, bloqueado)}</div>
      ${cuerpo}
      <div class="meta"><span class="pildora"><span class="punto"></span> ${nombreColor(c.hex)}</span>
        ${c.origen === 'heredado' ? `<span class="origen">${ui('enlace')} Hereda de ${esc(c.de)}</span>` : tipo === 'categoria' ? '<span class="origen">Color propio</span>' : ''}
        <span class="estado ${item.activo ? 'on' : 'off'}">${item.activo ? 'Activo' : 'Inactivo'}</span></div>
      <div class="card-pie">${bloqueado ? `<span class="candado">${ui('candado')} Siempre al final</span>` : `<span class="muted" style="color:var(--muted);font-size:12px">Orden ${i + 1}</span>`}<div class="card-acc">${botonesFila(item, tipo, i, total)}</div></div>
    </article>`
  }

  function dibujar() {
    const v = document.getElementById('vista')
    let html = pestanas(vista)
    if (vista === 'ambitos') {
      const L = DATOS.ambitos
      html += `<div class="rejilla">${L.map((a, i) => tarjeta(a, 'ambito', i, L.length, `<p style="margin:0;color:var(--muted)">${DATOS.categorias.filter((c) => c.ambito === a.id).length} categorías</p>`)).join('')}
        <button class="nuevo" data-nuevo="ambito">${ui('mas')} Nuevo ámbito</button></div>`
    } else if (vista === 'categorias') {
      html += DATOS.ambitos.map((a) => {
        const cats = DATOS.categorias.filter((c) => c.ambito === a.id)
        const L = DATOS.categorias
        return `<section class="grupo" style="${estiloColor(a.color)}"><div class="grupo-cab"><span class="insignia p">${svg(a.icono)}</span><h2>${esc(a.nombre)}</h2><span class="pildora"><span class="punto"></span> ${nombreColor(a.color)}</span></div>
          <div class="rejilla">${cats.map((c) => tarjeta(c, 'categoria', L.indexOf(c), L.length, `<div class="subs">${c.subs.length ? c.subs.map((s) => `<span class="pildora neutra">${esc(s)}</span>`).join('') : '<span class="origen">Sin subcategorías</span>'}<button class="enlace" style="font-size:12px" aria-label="Añadir subcategoría a ${esc(c.nombre)}">${ui('mas')} Subcategoría</button></div>`)).join('')}
          ${a.fijoAlFinal ? '' : `<button class="nuevo" data-nuevo="categoria">${ui('mas')} Nueva categoría en ${esc(a.nombre)}</button>`}</div></section>`
      }).join('')
    } else {
      const L = DATOS.medios
      html += `<div class="rejilla">${L.map((m, i) => tarjeta(m, 'medio', i, L.length, '')).join('')}<button class="nuevo" data-nuevo="medio">${ui('mas')} Nuevo medio de pago</button></div>`
    }
    v.innerHTML = html
    v.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => { vista = b.dataset.vista; dibujar() }))
  }
  manejarAcciones(document.getElementById('vista'), dibujar)
  document.addEventListener('tema', dibujar)
  dibujar()
</script>
</body>
</html>

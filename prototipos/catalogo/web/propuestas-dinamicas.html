<title>Propuestas de Catálogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* PROTOTIPO DE DISEÑO (no se compila con la app). Tokens = paleta B «Índigo» de la aplicación. */
:root {
  --bg: #f6f6fa; --surface: #fff; --surface-2: #ececf4; --line: #d9d9e6; --fg: #17172b; --muted: #58587a;
  --pri: #3a3fa6; --pri-fg: #fff; --pri-soft: #e0e1f7; --bad: #b3261e; --ok: #12663a; --ok-soft: #dcf2e4; --bad-soft: #f9dedc;
  --shadow: 0 12px 28px -8px rgba(23,23,43,.22), 0 2px 8px rgba(23,23,43,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) {
  --bg: #0f0f1c; --surface: #181829; --surface-2: #222238; --line: #34344f; --fg: #ececf8; --muted: #a5a5c8;
  --pri: #9ea3ff; --pri-fg: #101030; --pri-soft: #26264a; --bad: #ff8f86; --ok: #5ad08a; --ok-soft: #14301f; --bad-soft: #3f1b18;
  --shadow: 0 14px 32px -8px rgba(0,0,0,.65), 0 2px 10px rgba(0,0,0,.45);
  color-scheme: dark;
} }
:root[data-theme='dark'] {
  --bg: #0f0f1c; --surface: #181829; --surface-2: #222238; --line: #34344f; --fg: #ececf8; --muted: #a5a5c8;
  --pri: #9ea3ff; --pri-fg: #101030; --pri-soft: #26264a; --bad: #ff8f86; --ok: #5ad08a; --ok-soft: #14301f; --bad-soft: #3f1b18;
  --shadow: 0 14px 32px -8px rgba(0,0,0,.65), 0 2px 10px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 'Inter', 'Segoe UI', system-ui, sans-serif; }
h1, h2, h3 { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
.ico { width: 18px; height: 18px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

.barra-proto { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 24px; background: var(--fg); color: var(--bg); font-size: 12px; }
.barra-proto a { color: inherit; margin-right: 14px; }
.barra-acc { display: flex; align-items: center; }
.barra-acc .btn { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn-pri { background: var(--pri); color: var(--pri-fg); border-color: var(--pri); }
.btn-pri:hover:not(:disabled) { background: var(--pri); filter: brightness(1.08); }
.btn-ico { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); }
.btn-ico:hover:not(:disabled) { background: var(--surface-2); color: var(--fg); }
.enlace { background: none; border: 0; color: var(--pri); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; width: fit-content; }
.sw { width: 38px; height: 22px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); padding: 2px; display: inline-flex; }
.sw span { width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.sw[aria-checked='true'] { background: var(--pri); border-color: var(--pri); }
.sw[aria-checked='true'] span { transform: translateX(16px); background: var(--pri-fg); }

/* Color de elementos: variables --k-* calculadas en JS por tema */
.insignia { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--k-soft); border: 1px solid var(--k-borde); color: var(--k-icono); flex: none; }
.insignia.g { width: 52px; height: 52px; border-radius: 14px; }
.insignia.p { width: 28px; height: 28px; border-radius: 8px; }
.insignia.p .ico { width: 15px; height: 15px; }
.punto { width: 10px; height: 10px; border-radius: 50%; background: var(--k-base); flex: none; display: inline-block; }
.pildora { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--k-borde); background: var(--k-soft); color: var(--k-texto); font-size: 12px; font-weight: 600; }
.pildora.neutra { --k-borde: var(--line); --k-soft: var(--surface-2); --k-texto: var(--muted); }
.estado { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.estado.on { background: var(--ok-soft); color: var(--ok); } .estado.off { background: var(--surface-2); color: var(--muted); }
.origen { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.origen .ico { width: 13px; height: 13px; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(8,8,20,.55); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 50; padding: 24px; }
.modal { width: min(860px, 100%); max-height: 94vh; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.m-cab { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.m-cab h2 { font-size: 18px; }
.m-cuerpo { overflow: auto; min-height: 0; display: grid; grid-template-columns: 1fr 260px; gap: 22px; padding: 22px; }
.m-form { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.m-pie { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo > span { font-weight: 600; font-size: 13px; }
.campo input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.campo input[aria-invalid='true'] { border-color: var(--bad); }
.campo.mini { width: 96px; } .campo.mini:first-child { width: 120px; }
.iconos { display: flex; flex-wrap: wrap; gap: 6px; }
.iconos button { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); }
.iconos button[aria-checked='true'] { border-color: var(--pri); background: var(--pri-soft); color: var(--pri); }
.segmento { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 10px; width: fit-content; gap: 2px; }
.segmento button { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; }
.segmento button[aria-checked='true'] { background: var(--surface); color: var(--pri); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.paleta { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
.paleta.inactiva { opacity: .45; }
.muestra { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--k-borde); background: var(--k-base); display: grid; place-items: center; padding: 0; color: #fff; }
.muestra i { display: grid; place-items: center; }
.muestra[aria-checked='true'] { outline: 2px solid var(--fg); outline-offset: 2px; }
.muestra .ico { width: 16px; height: 16px; stroke-width: 3; }
.nota { color: var(--muted); font-size: 12px; margin: 4px 0 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.error { color: var(--bad); font-size: 12px; margin: 0; }
.m-previa { background: var(--surface-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-self: start; }
.m-previa h3 { font-size: 13px; }
.previa { border-radius: 10px; padding: 10px; border: 1px solid var(--line); }
.previa.claro { background: #fff; color: #17172b; } .previa.oscuro { background: #181829; color: #ececf8; }
.previa-fila { display: flex; align-items: center; gap: 10px; }
.previa-fila div { flex: 1; min-width: 0; } .previa-fila b { display: block; } .previa-fila small { opacity: .7; }
.picker { display: flex; flex-direction: column; gap: 10px; }
.sv { position: relative; height: 170px; border-radius: 12px; cursor: crosshair; touch-action: none; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(var(--h) 100% 50%)); border: 1px solid var(--line); }
.sv i { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4); }
.hue { -webkit-appearance: none; appearance: none; height: 14px; border-radius: 8px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); border: 1px solid var(--line); }
.hue::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; border: 3px solid #fff; background: transparent; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.entradas { display: flex; gap: 10px; align-items: flex-end; }
.contraste { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.c-fila { display: flex; gap: 10px; align-items: center; }
.c-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; } .c-badge.ok { background: var(--ok-soft); color: var(--ok); } .c-badge.mal { background: var(--bad-soft); color: var(--bad); }
.fila-btn { display: flex; gap: 10px; }

/* Tabla de reglas de administración */
.candado { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 10px 16px; border: 0; border-bottom: 2px solid transparent; background: none; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected='true'] { color: var(--pri); border-color: var(--pri); }

/* Estructura de la aplicación */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 38px); }
.lateral { border-right: 1px solid var(--line); background: var(--surface); padding: 18px 16px; display: flex; flex-direction: column; gap: 22px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 17px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--pri); color: var(--pri-fg); display: grid; place-items: center; font-weight: 800; }
.lateral nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.lateral nav a { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 10px; color: var(--fg); text-decoration: none; font-weight: 500; }
.lateral nav a[aria-current='page'] { background: var(--pri-soft); color: var(--pri); font-weight: 600; }
.usuario { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; font-size: 13px; } .usuario small { color: var(--muted); }
.contenido { padding: 26px 32px 40px; max-width: 1200px; width: 100%; }
.cab-pagina { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
.cab-pagina h1 { font-size: 26px; } .cab-pagina p { margin: 2px 0 0; color: var(--muted); }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

/* Propuestas dinámicas (se ensambla con shared.css en un solo archivo para la web) */
body { padding-block: 0; }
.pagina { max-width: 1320px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.d-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.d-cab h1 { font-size: 24px; text-wrap: balance; }
.d-cab p { margin: 2px 0 0; color: var(--muted); max-width: 62ch; }
.d-cab .acc { display: flex; gap: 8px; flex-wrap: wrap; }
.d-vars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 18px 0 14px; }
.d-var { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: transform .15s, border-color .15s, background .15s; min-width: 0; }
.d-var:hover { transform: translateY(-2px); border-color: var(--pri); }
.d-var[aria-pressed='true'] { background: var(--pri-soft); border-color: var(--pri); }
.d-var b { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.d-var .l { width: 24px; height: 24px; border-radius: 8px; background: var(--pri); color: var(--pri-fg); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.d-var small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.d-barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.d-barra .tabs { overflow-x: auto; max-width: 100%; }
.d-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.d-tools .segmento button { padding: 5px 10px; }
.d-stage { position: relative; animation: entrada .28s ease-out; }
@keyframes entrada { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.d-split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.d-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.pista { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }

/* Detalle común */
.d-det { display: flex; flex-direction: column; gap: 14px; }
.d-det-cab { display: flex; gap: 12px; align-items: center; } .d-det-cab > div:nth-child(2) { flex: 1; min-width: 0; }
.d-det-cab h3 { font-size: 18px; } .d-det-cab p { margin: 2px 0 6px; color: var(--muted); }
.d-qc { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.d-sw { aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; background: var(--k-base); padding: 0; transition: transform .12s; }
.d-sw:hover { transform: scale(1.18); } .d-sw[aria-pressed='true'] { outline: 2px solid var(--fg); outline-offset: 2px; }
.d-her { grid-column: 1 / -1; display: inline-flex; gap: 6px; align-items: center; justify-content: center; padding: 6px; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font-weight: 600; }
.d-her[aria-pressed='true'] { border-color: var(--pri); color: var(--pri); background: var(--pri-soft); }
.d-tonos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.d-tono { border-radius: 10px; border: 1px solid var(--line); padding: 8px; font-size: 12px; } .d-tono.claro { background: #fff; color: #17172b; } .d-tono.oscuro { background: #181829; color: #ececf8; }
.d-tono .f { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.d-acc { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ins { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--k-soft); border: 1px solid var(--k-borde); color: var(--k-icono); flex: none; transition: background .35s, border-color .35s, color .35s; }
.ins.g { width: 52px; height: 52px; border-radius: 14px; } .ins.p { width: 26px; height: 26px; border-radius: 8px; } .ins.p .ico { width: 14px; height: 14px; }
[data-cid] { transition: background-color .35s, border-color .35s, fill .35s, color .35s; }

/* B · explorador */
.arbol { display: flex; flex-direction: column; gap: 2px; }
.nodo { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: 10px; background: none; text-align: left; }
.nodo:hover { background: var(--surface-2); } .nodo[aria-selected='true'] { background: var(--pri-soft); border-color: var(--pri); }
.nodo .cnt { margin-left: auto; color: var(--muted); font-size: 12px; } .nodo.off { opacity: .5; }
.hijos { margin-left: 20px; padding-left: 8px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.chev { transition: transform .15s; color: var(--muted); } .chev[data-abierto='true'] { transform: rotate(90deg); }

/* D · mosaico */
.d-lienzo { position: relative; width: 100%; aspect-ratio: 100 / 66; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.d-teja { position: absolute; padding: 0; border: 0; background: none; transition: left .55s cubic-bezier(.3,.8,.3,1), top .55s cubic-bezier(.3,.8,.3,1), width .55s cubic-bezier(.3,.8,.3,1), height .55s cubic-bezier(.3,.8,.3,1); }
.d-teja > span { position: absolute; inset: 2px; border-radius: 10px; background: var(--k-soft); border: 1.5px solid var(--k-borde); color: var(--k-texto); display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 2px; padding: 8px 10px; overflow: hidden; text-align: left; transition: transform .15s, box-shadow .15s, background .35s, border-color .35s; }
.d-teja:hover > span { transform: scale(1.02); box-shadow: var(--shadow); z-index: 3; }
.d-teja[aria-pressed='true'] > span { border-width: 3px; border-color: var(--k-base); box-shadow: var(--shadow); }
.d-teja.off > span { opacity: .5; background-image: repeating-linear-gradient(135deg, transparent 0 8px, rgba(128,128,128,.14) 8px 10px); }
.d-teja .ico { color: var(--k-icono); } .d-teja b { font-size: 13px; line-height: 1.15; } .d-teja small { opacity: .85; font-size: 11px; }
.d-teja[data-s='s'] small, .d-teja[data-s='xs'] small, .d-teja[data-s='xs'] b, .d-teja[data-s='xs'] .ico { display: none; }
.d-grupo { position: absolute; transition: all .55s cubic-bezier(.3,.8,.3,1); border-radius: 12px; border: 1.5px dashed var(--k-borde); pointer-events: none; }
.d-grupo i { position: absolute; top: 4px; left: 10px; font-style: normal; font-size: 11px; font-weight: 700; color: var(--k-texto); text-transform: uppercase; letter-spacing: .05em; }

/* E · tablero */
.d-tablero { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.d-col { flex: 1 0 210px; min-width: 210px; background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; transition: background .15s, outline-color .15s; outline: 2px dashed transparent; }
.d-col.sobre { outline-color: var(--pri); background: var(--pri-soft); }
.d-col h3 { font-size: 13px; display: flex; align-items: center; gap: 8px; } .d-col h3 span:last-child { margin-left: auto; color: var(--muted); font-weight: 500; }
.d-fila { display: flex; flex-direction: row; flex-wrap: wrap; } .d-fila .d-card { flex: 1 0 200px; }
.d-card { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--k-base); border-radius: 12px; cursor: grab; text-align: left; transition: transform .15s, box-shadow .15s, opacity .15s; }
.d-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.d-card[aria-pressed='true'] { border-color: var(--pri); box-shadow: 0 0 0 2px var(--pri); }
.d-card.arrastrando { opacity: .35; transform: scale(.97); } .d-card.fijo { cursor: default; background: var(--surface-2); }
.d-card.antes { box-shadow: 0 -4px 0 0 var(--pri); } .d-col.final::after { content: ''; height: 4px; border-radius: 4px; background: var(--pri); }
.d-card .fila { display: flex; align-items: center; gap: 8px; } .d-card b { flex: 1; min-width: 0; }
.d-card small { color: var(--muted); }

/* F · anillos */
.d-anillos { position: relative; max-width: 560px; margin: 0 auto; }
.d-anillos svg { width: 100%; height: auto; display: block; }
.arco { fill: var(--k-base); stroke: var(--surface); stroke-width: 2; cursor: pointer; transition: fill .35s, opacity .25s, transform .25s; outline: none; }
.arco:hover, .arco:focus-visible { filter: brightness(1.15); }
.arco.dim { opacity: .28; } .arco.off { opacity: .45; }
.arco:focus-visible { stroke: var(--fg); stroke-width: 3; }
.d-centro { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
.d-centro b { display: block; font-size: 17px; max-width: 110px; } .d-centro small { color: var(--muted); }
.d-tip { position: absolute; z-index: 4; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; min-width: 130px; opacity: 0; transition: opacity .12s; }
.d-tip.on { opacity: 1; }

/* G · estudio */
.d-estudio { display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
.d-lista { display: flex; flex-direction: column; gap: 2px; }
.d-pvs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.d-pv { border-radius: 14px; padding: 12px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 0; font-size: 12px; }
.d-pv.claro { background: #fff; color: #17172b; } .d-pv.oscuro { background: #181829; color: #ececf8; }
.d-pv h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.d-pv svg { width: 100%; max-width: 130px; margin: 0 auto; display: block; }

/* ---------- Acciones comunes (editar, ordenar, activar, eliminar) sobre los datos de ejemplo ---------- */
function listaDe(tipo) { return tipo === 'ambito' ? DATOS.ambitos : tipo === 'categoria' ? DATOS.categorias : DATOS.medios }
function manejarAcciones(raiz, redibujar) {
  raiz.addEventListener('click', (e) => {
    const b = e.target.closest('[data-accion], .sw, [data-nuevo]')
    if (!b || b.disabled) return
    if (b.dataset.nuevo) { abrirModal({ tipo: b.dataset.nuevo, onGuardar: (r) => { listaDe(r.tipo).splice(listaDe(r.tipo).length - 1, 0, { id: 'n' + Date.now(), nombre: r.nombre, icono: r.icono, color: r.color, activo: true, gastos: 0, subs: [], ambito: 'a1' }); redibujar() } }); return }
    const fila = b.closest('[data-id]')
    const id = fila?.dataset.id, tipo = fila?.dataset.tipo
    if (!id) return
    const lista = listaDe(tipo), i = lista.findIndex((x) => x.id === id)
    if (b.classList.contains('sw')) { lista[i].activo = !lista[i].activo; redibujar(); return }
    const a = b.dataset.accion
    if (a === 'editar') abrirModal({ tipo, item: lista[i], onGuardar: (r) => { Object.assign(lista[i], { nombre: r.nombre, icono: r.icono, color: r.color }); redibujar() } })
    if (a === 'subir' && i > 0) { [lista[i - 1], lista[i]] = [lista[i], lista[i - 1]]; redibujar() }
    if (a === 'bajar' && i < lista.length - 2) { [lista[i + 1], lista[i]] = [lista[i], lista[i + 1]]; redibujar() }
    if (a === 'borrar' && eliminable(lista[i], tipo).ok) { lista.splice(i, 1); redibujar() }
  })
}

}

/* ---------- Arrastrar y soltar genérico ---------- */
function activarDnd(raiz, onDrop) {
  let arr = null
  const limpiar = () => raiz.querySelectorAll('.antes, .sobre, .final, .arrastrando').forEach((e) => e.classList.remove('antes', 'sobre', 'final', 'arrastrando'))
  const destino = (e, zona) => {
    const cartas = [...zona.querySelectorAll('[data-drag]')].filter((c) => c.dataset.id !== arr && c.dataset.fijo !== '1')
    const horiz = zona.dataset.eje === 'x'
    return cartas.find((c) => { const r = c.getBoundingClientRect(); return horiz ? e.clientX < r.left + r.width / 2 || e.clientY < r.top : e.clientY < r.top + r.height / 2 }) ?? null
  }
  raiz.addEventListener('dragstart', (e) => { const c = e.target.closest('[data-drag]'); if (!c || c.dataset.fijo === '1') { e.preventDefault(); return } arr = c.dataset.id; e.dataTransfer.setData('text/plain', arr); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => c.classList.add('arrastrando'), 0) })
  raiz.addEventListener('dragend', () => { arr = null; limpiar() })
  raiz.addEventListener('dragover', (e) => {
    const zona = e.target.closest('[data-zona]'); if (!zona || !arr) return
    e.preventDefault(); limpiar(); zona.classList.add('sobre')
    const d = destino(e, zona); if (d) d.classList.add('antes'); else zona.classList.add('final')
  })
  raiz.addEventListener('drop', (e) => {
    const zona = e.target.closest('[data-zona]'); if (!zona || !arr) return
    e.preventDefault(); const d = destino(e, zona); const id = arr; arr = null; limpiar(); onDrop(id, zona.dataset.zona, d?.dataset.id ?? null)
  })
}
function mover(lista, id, antesId, extra) {
  const i = lista.findIndex((x) => x.id === id); if (i < 0) return
  const [it] = lista.splice(i, 1); Object.assign(it, extra || {})
  let j = antesId ? lista.findIndex((x) => x.id === antesId) : -1
  if (j < 0) { const fin = lista.findIndex((x) => x.fijoAlFinal && (!extra?.ambito || x.ambito === extra.ambito)); j = fin >= 0 ? fin : lista.length }
  lista.splice(j, 0, it)
}

/* ---------- D · Mosaico proporcional (treemap animado) ---------- */
function squarify(items, x, y, w, h) {

    rest = rest.slice(fila.length)
  }

}

  const tipo = tipoSec(), lista = listaDe(tipo)
  let filtro = host.dataset.q || ''
  host.innerHTML = `<div class="d-split"><div class="d-panel"><div class="d-tools" style="margin-bottom:10px"><div class="d-buscar" style="flex:1">${ui('buscar')}<input id="h-q" placeholder="Buscar… (la lista se filtra al escribir)" aria-label="Buscar" value="${esc(filtro)}"></div></div><div class="d-h" id="h-lista"></div>
    <div class="d-nuevo" style="margin-top:12px"><input id="h-nuevo" placeholder="Escribe un nombre y pulsa Enter para añadir…" aria-label="Nuevo elemento"></div>
    <p class="pista">Clic en un nombre para renombrar · punto de color para cambiarlo · arrastra el asa para ordenar · ↑ ↓ para moverte por las filas.</p></div><div class="d-panel" id="detalle">${detalleHtml()}</div></div>`
  const cont = $('#h-lista')
  const resaltar = (t) => { if (!filtro) return esc(t); const i = t.toLowerCase().indexOf(filtro.toLowerCase()); return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + filtro.length)) + '</mark>' + esc(t.slice(i + filtro.length)) }
  const coincide = (it) => !filtro || it.nombre.toLowerCase().includes(filtro.toLowerCase()) || (it.subs || []).some((s) => s.toLowerCase().includes(filtro.toLowerCase()))
  const fila = (it) => `<div class="d-hfila ${it.activo ? '' : 'off'} ${APP.sel.id === it.id ? 'foco' : ''}" ${it.fijoAlFinal ? '' : 'draggable="true"'} data-drag data-id="${it.id}" data-fijo="${it.fijoAlFinal ? 1 : 0}" data-cid="${tipo}:${it.id}" data-hf>
    <span class="asa" aria-hidden="true">${it.fijoAlFinal ? ui('candado') : ui('arrastrar')}</span><button class="d-punto" data-punto="${it.id}" aria-label="Cambiar color de ${esc(it.nombre)}" aria-haspopup="true"></button>${ins(it, 'p')}
    <button class="nom" data-ren="${it.id}" aria-label="Renombrar ${esc(it.nombre)}">${resaltar(it.nombre)}</button><span class="num" style="color:var(--muted);font-size:12px">${it.gastos}</span><span data-id="${it.id}" data-tipo="${tipo}">${interruptor(it.activo, it.nombre, it.fijoAlFinal)}</span>
    <button class="btn-ico" data-del="${it.id}" aria-label="Eliminar ${esc(it.nombre)}" title="${esc(eliminable(it, tipo).motivo)}" ${eliminable(it, tipo).ok ? '' : 'disabled'}>${ui('papelera')}</button></div>`
  const pintarLista = () => {
    if (tipo === 'categoria') cont.innerHTML = DATOS.ambitos.map((a) => { const cs = lista.filter((c) => c.ambito === a.id && coincide(c)); return cs.length ? `<div data-zona="${a.id}" data-eje="y"><div class="d-hgrupo" data-cid="ambito:${a.id}"><span class="punto"></span>${esc(a.nombre)}</div>${cs.map((c) => fila(c)).join('')}</div>` : '' }).join('') || '<p class="pista">Sin resultados.</p>'
    else cont.innerHTML = `<div data-zona="lista" data-eje="y" style="display:flex;flex-direction:column;gap:4px">${lista.filter(coincide).map((it) => fila(it)).join('') || '<p class="pista">Sin resultados.</p>'}</div>`
    pintarTodo()
  }
  pintarLista()
  activarDnd(cont, (id, zona, antes) => { guardarSnap(); mover(lista, id, antes, tipo === 'categoria' ? { ambito: zona } : undefined); redibujar() })
  $('#h-q').addEventListener('input', (e) => { filtro = host.dataset.q = e.target.value; pintarLista() })
  $('#h-nuevo').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return
    guardarSnap(); const col = COLORES[(lista.length * 3) % COLORES.length].hex
    const nuevo = { id: 'n' + Date.now(), nombre: e.target.value.trim(), icono: 'etiqueta', color: tipo === 'categoria' ? null : col, activo: true, gastos: 0, subs: [], ambito: APP.sel.tipo === 'categoria' ? (itemDe('categoria', APP.sel.id)?.ambito ?? 'a1') : 'a1' }
    const fin = lista.findIndex((x) => x.fijoAlFinal && (tipo !== 'categoria' || x.ambito === nuevo.ambito)); lista.splice(fin >= 0 ? fin : lista.length, 0, nuevo); APP.sel = { tipo, id: nuevo.id }; redibujar()
  })
  cont.addEventListener('click', (e) => {
    const f = e.target.closest('[data-hf]'); if (!f) return
    const id = f.dataset.id
    const pt = e.target.closest('[data-punto]')
    if (pt) { abrirPop(pt, id); return }
    const rn = e.target.closest('[data-ren]')
    if (rn) {
      const it = itemDe(tipo, id), inp = document.createElement('input'); inp.className = 'nom'; inp.value = it.nombre; inp.maxLength = 40; inp.setAttribute('aria-label', 'Nuevo nombre'); rn.replaceWith(inp); inp.focus(); inp.select()
      const fin = (ok) => { if (ok && inp.value.trim()) { guardarSnap(); it.nombre = inp.value.trim() } redibujar() }
      inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') fin(true); if (ev.key === 'Escape') fin(false) }); inp.addEventListener('blur', () => fin(true)); return
    }
    const del = e.target.closest('[data-del]')
    if (del && !del.disabled) { guardarSnap(); const antes = historial.pop(); const it = itemDe(tipo, id); lista.splice(lista.indexOf(it), 1); redibujar(); aviso(`«${it.nombre}» eliminado`, () => { Object.assign(DATOS, JSON.parse(antes)); redibujar() }); return }
    if (!e.target.closest('.sw')) { APP.sel = { tipo, id }; refrescarDetalle(); cont.querySelectorAll('.d-hfila').forEach((r) => r.classList.toggle('foco', r.dataset.id === id)) }
  })
  host.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return
    const filas = [...cont.querySelectorAll('.d-hfila .nom')], i = filas.indexOf(document.activeElement); if (i < 0) return
    e.preventDefault(); filas[Math.max(0, Math.min(filas.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus()
  })
  function abrirPop(boton, id) {
    document.querySelector('.d-pop')?.remove()
    const it = itemDe(tipo, id), r = boton.getBoundingClientRect(), p = document.createElement('div'); p.className = 'd-pop'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', `Color de ${it.nombre}`)
    p.innerHTML = `<div class="d-qc">${COLORES.map((k) => `<button class="d-sw" style="--k-base:${k.hex}" data-c="${k.hex}" aria-label="${k.nombre}" title="${k.nombre}" aria-pressed="${(it.color || '').toLowerCase() === k.hex.toLowerCase()}"></button>`).join('')}</div>
      ${tipo === 'categoria' ? `<button class="d-her" data-c="heredar" style="margin-top:8px;width:100%" aria-pressed="${!it.color}">${ui('enlace')} Heredar del ámbito</button>` : ''}`
    p.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 248)) + 'px'; p.style.top = window.scrollY + r.bottom + 6 + 'px'
    document.body.appendChild(p); p.querySelector('[data-c]').focus()
    const cerrar = () => { p.remove(); document.removeEventListener('mousedown', fuera); document.removeEventListener('keydown', esc2) }
    const fuera = (ev) => { if (!p.contains(ev.target) && ev.target !== boton) cerrar() }; const esc2 = (ev) => { if (ev.key === 'Escape') { cerrar(); boton.focus() } }
    document.addEventListener('mousedown', fuera); document.addEventListener('keydown', esc2)
    p.addEventListener('click', (ev) => { const c = ev.target.closest('[data-c]'); if (!c) return; guardarSnap(); it.color = c.dataset.c === 'heredar' ? null : c.dataset.c; cerrar(); pintarTodo(); refrescarDetalle(); pintarLista() })
  }
}

/* ---------- Esqueleto de la página ---------- */
const RENDER = { B: renderB, D: renderD, E: renderE, F: renderF, G: renderG, H: renderH }
function cabecera() {
  const v = VARIANTES.find((x) => x[0] === APP.v)
  $('#d-vars').innerHTML = VARIANTES.map(([k, n, d]) => `<button class="d-var" data-v="${k}" aria-pressed="${APP.v === k}"><b><span class="l">${k}</span>${n}</b><small>${d}</small></button>`).join('')
  $('#d-tabs').innerHTML = Object.entries(SEC_NOMBRE).map(([k, n]) => `<button role="tab" aria-selected="${APP.sec === k}" data-sec="${k}">${n}</button>`).join('')
  const tema = temaActual(); $('#d-tema').innerHTML = tema === 'claro' ? `${ui('luna')} Oscuro` : `${ui('sol')} Claro`
  document.title = `Propuestas de Catálogo · ${v[1]}`
}
function redibujar() {
  validarSel(); cabecera(); const stage = $('#stage'); stage.innerHTML = ''; stage.style.animation = 'none'; void stage.offsetWidth; stage.style.animation = ''
  RENDER[APP.v](stage); pintarTodo()
}
function iniciar() {
  document.body.insertAdjacentHTML('afterbegin', `<div class="pagina"><header class="d-cab"><div><h1>Catálogo · propuestas dinámicas</h1><p>Prueba cada una con los mismos datos de ejemplo: cambia colores, ordena, activa, elimina. Nada se guarda; es solo diseño.</p></div>
    <div class="acc"><button class="btn" id="d-reset">Restablecer datos</button><button class="btn" id="d-tema" aria-label="Cambiar tema"></button></div></header>
    <nav class="d-vars" id="d-vars" aria-label="Propuestas"></nav>
    <div class="d-barra"><div class="tabs" id="d-tabs" role="tablist" aria-label="Sección del catálogo"></div></div><section class="d-stage" id="stage" aria-live="polite"></section></div>`)
  document.addEventListener('click', (e) => {
    const v = e.target.closest('[data-v]'); if (v) { APP.v = v.dataset.v; redibujar(); return }
    const s = e.target.closest('[data-sec]'); if (s) { APP.sec = s.dataset.sec; redibujar(); return }
    if (e.target.closest('#d-tema')) { fijarTema(temaActual() === 'claro' ? 'oscuro' : 'claro'); return }
    if (e.target.closest('#d-reset')) { Object.assign(DATOS, JSON.parse(DATOS_INICIALES)); historial.length = 0; redibujar(); return }
    const q = e.target.closest('[data-qc]')
    if (q) { const it = itemDe(APP.sel.tipo, APP.sel.id); guardarSnap(); it.color = q.dataset.qc === 'heredar' ? null : q.dataset.qc; pintarTodo(); refrescarDetalle(); document.dispatchEvent(new CustomEvent('seleccion')); const lista = $('.d-lista'); if (lista) pintarTodo() }
  })
  manejarAcciones($('#stage'), redibujar)
  document.addEventListener('tema', redibujar)
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) document.dispatchEvent(new CustomEvent('tema')) })
  redibujar()
}
if (document.body) iniciar(); else document.addEventListener("DOMContentLoaded", iniciar)

</script>

# Publicación en Netlify: la app es una SPA estática (carpeta dist). Las variables VITE_* se definen en el panel de Netlify, nunca aquí.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rutas de la SPA (/gastos, /fondos…) y enlaces de recuperación de contraseña: todo se sirve desde index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: la app no usa scripts en línea; style 'unsafe-inline' es necesario por los estilos dinámicos de React. Si se añade un proveedor (OAuth por redirección no requiere cambios), actualizar aquí y en e2e-pwa/csp.spec.ts.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # HSTS sin includeSubDomains ni preload hasta confirmar el dominio definitivo y que TODOS sus subdominios sirven HTTPS.
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"

# Los archivos de /assets llevan hash en el nombre: se pueden cachear sin límite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA: el Service Worker, el manifiesto y la cáscara se revalidan SIEMPRE (así cada despliegue llega a quien ya instaló la app);
# solo /assets (con hash en el nombre) se cachea sin límite. Un sw.js cacheado por el navegador impediría actualizar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache"

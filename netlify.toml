# Publicación en Netlify: la app es una SPA estática (carpeta dist). Las variables VITE_* se definen en el panel de Netlify, nunca aquí.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rutas de la SPA (/gastos, /fondos…) y enlaces de recuperación de contraseña: todo se sirve desde index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos de /assets llevan hash en el nombre: se pueden cachear sin límite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA: el Service Worker, el manifiesto y la cáscara se revalidan SIEMPRE (así cada despliegue llega a quien ya instaló la app);
# solo /assets (con hash en el nombre) se cachea sin límite. Un sw.js cacheado por el navegador impediría actualizar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache"

# Publicación en Netlify: la app es una SPA estática (carpeta dist). Las variables VITE_* se definen en el panel de Netlify, nunca aquí.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rutas de la SPA (/gastos, /fondos…) y enlaces de recuperación de contraseña: todo se sirve desde index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos de /assets llevan hash en el nombre: se pueden cachear sin límite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
